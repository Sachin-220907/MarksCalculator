<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Student Marks Calculator</h1>

<form>
    <label>Student Name</label>
    <input type="text" id="studentName" placeholder="Enter the name">
    <label>Register Number</label>
    <input type="text" id="registerNumber" placeholder="Enter your roll number">
    <h3>Enter Subject Marks</h3>
    <label>Sub 1</label>
    <input type="number" id="subject1" placeholder="Enter the marks">
    <label>Sub 2</label>
    <input type="number" id="subject2" placeholder="Enter the marks">
    <label>Sub 3</label>
    <input type="number" id="subject3" placeholder="Enter the marks">
    <label>Sub 4</label>
    <input type="number" id="subject4" placeholder="Enter the marks">
    <label>Sub 5</label>
    <input type="number" id="subject5" placeholder="Enter the marks">
    <button type="button" id="calculate">Calculate</button>
    <button type="reset">Reset</button>
</form>
<script src="script.js"></script>
</body>
</html>
